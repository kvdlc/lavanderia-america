<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#105189;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d3f6b;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#ffffff"/>
  <!-- Building -->
  <rect x="140" y="100" width="200" height="170" rx="4" fill="url(#blueGrad)" opacity="0.15"/>
  <rect x="130" y="90" width="220" height="15" rx="3" fill="#105189"/>
  <!-- Roof -->
  <polygon points="120,90 240,30 360,90" fill="#a81a17" opacity="0.8"/>
  <!-- Windows -->
  <rect x="160" y="120" width="30" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="210" y="120" width="30" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="260" y="120" width="30" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="160" y="170" width="30" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="210" y="170" width="30" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="260" y="170" width="30" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <!-- Door -->
  <rect x="215" y="220" width="50" height="50" rx="4" fill="#a81a17" opacity="0.9"/>
  <!-- Washing machine cylinder -->
  <circle cx="110" cy="180" r="35" fill="none" stroke="#105189" stroke-width="4" opacity="0.4"/>
  <circle cx="110" cy="180" r="25" fill="none" stroke="#105189" stroke-width="2" opacity="0.3"/>
  <circle cx="110" cy="180" r="4" fill="#105189" opacity="0.5"/>
  <!-- Laundry cart -->
  <rect x="280" y="230" width="40" height="10" rx="3" fill="#a81a17" opacity="0.5"/>
  <rect x="285" y="200" width="30" height="30" rx="3" fill="#a81a17" opacity="0.15" stroke="#a81a17" stroke-width="1.5" opacity="0.4"/>
  <!-- Steam lines -->
  <path d="M 190 100 Q 195 85 190 70" fill="none" stroke="#105189" stroke-width="2" opacity="0.3"/>
  <path d="M 210 95 Q 215 78 210 60" fill="none" stroke="#105189" stroke-width="2" opacity="0.25"/>
  <path d="M 230 98 Q 235 80 230 65" fill="none" stroke="#105189" stroke-width="2" opacity="0.2"/>
  <!-- Chimney -->
  <rect x="280" y="50" width="15" height="40" fill="#105189" opacity="0.6"/>
  <!-- Smoke -->
  <circle cx="287" cy="42" r="6" fill="#105189" opacity="0.15"/>
  <circle cx="295" cy="32" r="8" fill="#105189" opacity="0.1"/>
  <circle cx="305" cy="25" r="10" fill="#105189" opacity="0.06"/>
</svg>
